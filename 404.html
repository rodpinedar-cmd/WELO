.links{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
.links a{padding:12px 24px;border-radius:50px;font-weight:600;font-size:0.9rem;text-decoration:none;transition:transform 0.2s;}
.links a.primary{background:linear-gradient(135deg,var(--pink),var(--dark-pink));color:white;}
.links a.secondary{background:white;color:var(--dark-pink);border:2px solid var(--pink);}
.links a:hover{transform:translateY(-2px);}

</head>
